name: sync-upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    # Only run in the fork, never in charmbracelet/crush itself.
    if: github.repository != 'charmbracelet/crush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/charmbracelet/crush.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! go build ./...; then
            echo "status=buildfail" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin HEAD:main; then
            echo "status=pushfail" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Report problems
        if: contains(fromJSON('["conflict","buildfail","pushfail"]'), steps.merge.outputs.status)
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          title="Upstream sync needs attention ($STATUS)"
          if [ -n "$(gh issue list --state open --search "in:title \"Upstream sync needs attention\"" --json number --jq '.[0].number')" ]; then
            exit 0
          fi
          gh issue create --title "$title" --body "Merging charmbracelet/crush main into this fork failed: **$STATUS**. Run \`./scripts/sync-upstream.sh\` locally (or ask your coding agent to) to resolve it. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
